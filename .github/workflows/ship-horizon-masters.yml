name: Ship Horizon first-pass masters

on:
  workflow_dispatch:
  push:
    branches: [horizon-pipeline-masters]

permissions:
  contents: write

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install pillow

      - name: Generate convert rebuild validate
        run: bash tools/ship_horizon_masters.sh

      - name: Commit generated masters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tools/reference_art tools/traced_*.json tools/make_sprites.py src/data/sprites.js docs/ || true
          if git diff --staged --quiet; then
            echo "No asset changes to commit"
          else
            git commit -m "Horizon first-pass masters: 120 unique stage plates (CI ship)"
            git push
          fi
