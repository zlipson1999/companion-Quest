name: Ship Horizon concept masters

on:
  workflow_dispatch:
  push:
    branches: [horizon-concept-masters]

permissions:
  contents: write

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: pip install pillow
      - name: Generate convert rebuild
        run: bash tools/ship_horizon_masters.sh
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tools/reference_art tools/traced_*.json tools/make_sprites.py src/data/sprites.js docs/ tools/lineups || true
          if git diff --staged --quiet; then
            echo "No asset changes"
          else
            git commit -m "Horizon concept masters: 120 forms + contact sheets"
            git push
          fi
